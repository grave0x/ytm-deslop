<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTM-DeSlop</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #202124;
      margin: 0;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #34a853;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      background: #f1f3f4;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: #1a73e8;
    }
    .stat-label {
      font-size: 10px;
      color: #5f6368;
      text-transform: uppercase;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f1f3f4;
      border-radius: 6px;
      font-size: 13px;
      color: #3c4043;
      cursor: pointer;
      transition: background 0.2s;
    }
    .action:hover {
      background: #e8eaed;
    }
    .action-primary {
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: 500;
    }
    .action-primary:hover {
      background: #d2e3fc;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">YTM-DeSlop</h1>
    <div class="status-dot"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="statBlocked">-</div>
      <div class="stat-label">Blocked</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statWarned">-</div>
      <div class="stat-label">Warned</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statManual">-</div>
      <div class="stat-label">Manual</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statTotal">-</div>
      <div class="stat-label">Total</div>
    </div>
  </div>

  <div class="actions">
    <div class="action" id="actionOpenOptions">
      <span>Settings</span>
    </div>
    <div class="action action-primary" id="actionOpenOptions2">
      <span>Export Data</span>
    </div>
    <div class="action" id="actionRefresh">
      <span>Refresh Blocklist</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
