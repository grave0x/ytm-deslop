name: Weekly Blocklist Refresh
on:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - run: pip install -r requirements.txt
      - run: python3 build/build.py
      - name: Create release
        if: github.event.schedule != '' && github.ref == 'refs/heads/main'
        env: GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd output && sha256sum * > checksums.txt
          gh release create v1.0.0 \
            --draft --prerelease false \
            --title "YTM-DeSlop v1.0.0" \
            --notes "Weekly refresh of AI music slop blocklist"
