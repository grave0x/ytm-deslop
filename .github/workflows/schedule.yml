name: Weekly Blocklist Refresh

on:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python3 build/build.py

      - name: Generate checksums
        run: |
          cd output
          for f in *.zip; do sha256sum "$f"; done > checksums.txt
          cat checksums.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u +%Y-W%V)
          TAG="blocklist-${WEEK}"
          gh release create "$TAG" \
            --draft \
            --title "Blocklist refresh ${WEEK}" \
            --notes "Automated weekly refresh of the AI music slop blocklist." \
            output/*.zip output/checksums.txt \
            || echo "release step skipped (tag may exist)"
